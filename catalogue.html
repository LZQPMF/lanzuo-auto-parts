<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lanzuo Auto Parts - Catalogue 2026</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0A1F3D; min-height: 100vh; user-select: none; }

/* Login Screen */
#login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
#login-screen .logo { font-size: 42px; font-weight: 800; color: #fff; letter-spacing: 3px; margin-bottom: 5px; }
#login-screen .tagline { font-size: 12px; color: #EE8A35; letter-spacing: 4px; margin-bottom: 50px; text-transform: uppercase; }
#login-screen h2 { color: #fff; font-size: 20px; font-weight: 400; margin-bottom: 30px; text-align: center; }
#login-screen input { width: 100%; max-width: 360px; padding: 16px 20px; font-size: 16px; border: 2px solid #1E3A5F; border-radius: 8px; background: #162D4D; color: #fff; outline: none; }
#login-screen input:focus { border-color: #EE8A35; }
#login-screen button { margin-top: 20px; width: 100%; max-width: 360px; padding: 16px; font-size: 16px; font-weight: 600; background: #EE8A35; color: #fff; border: none; border-radius: 8px; cursor: pointer; letter-spacing: 1px; }
#login-screen button:hover { background: #d97a28; }
#login-screen .error { color: #ff6b6b; margin-top: 15px; font-size: 14px; display: none; }
#login-screen .hint { margin-top: 40px; color: #555; font-size: 12px; }

/* Viewer Screen */
#viewer { display: none; flex-direction: column; height: 100vh; }
.topbar { background: #0A1F3D; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.topbar .brand { color: #fff; font-weight: 700; font-size: 16px; letter-spacing: 2px; }
.topbar .brand span { color: #EE8A35; }
.topbar .nav { display: flex; align-items: center; gap: 10px; }
.topbar .nav button { background: #1E3A5F; color: #fff; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-size: 13px; }
.topbar .nav button:hover { background: #EE8A35; }
.topbar .nav .page-info { color: #aaa; font-size: 13px; margin: 0 10px; }

.page-area { flex: 1; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 20px; background: #1a1a2e; }
.page-area img { max-width: 100%; max-width: 800px; width: 100%; height: auto; box-shadow: 0 4px 30px rgba(0,0,0,0.5); }

.bottombar { background: #0A1F3D; padding: 12px 20px; display: flex; justify-content: center; align-items: center; gap: 20px; flex-shrink: 0; }
.bottombar button { background: #1E3A5F; color: #fff; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.bottombar button:hover { background: #EE8A35; }
.bottombar .page-info { color: #aaa; font-size: 14px; }

/* Mobile nav */
@media (max-width: 600px) {
  .topbar { flex-wrap: wrap; gap: 8px; }
  .topbar .brand { font-size: 14px; }
  .page-area { padding: 10px; }
}
</style>
</head>
<body>

<div id="login-screen">
  <div class="logo">LANZUO</div>
  <div class="tagline">Precision Auto Parts</div>
  <h2>Product Catalogue 2026<br>Restricted Access</h2>
  <input type="password" id="password" placeholder="Enter password" onkeypress="if(event.key==='Enter')checkPass()">
  <button onclick="checkPass()">VIEW CATALOGUE</button>
  <div class="error" id="error">Incorrect password.</div>
  <div class="hint">Contact Lanzuo Auto Parts for access.</div>
</div>

<div id="viewer">
  <div class="topbar">
    <div class="brand">LANZUO <span>CATALOGUE 2026</span></div>
    <div class="nav">
      <button onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="page-area">
    <img id="pageImg" src="pages/page_01.jpg" alt="Page">
  </div>
  <div class="bottombar">
    <button onclick="prevPage()">◀ Prev</button>
    <span class="page-info" id="pageInfo">1 / 43</span>
    <button onclick="nextPage()">Next ▶</button>
  </div>
</div>

<script>
const TOTAL = 43;
let current = 1;

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPass() {
  const input = document.getElementById('password').value;
  const expected = await sha256('lanzuo2026');
  const hash = await sha256(input);
  if (hash === expected) {
    sessionStorage.setItem('authed', '1');
    showViewer();
  } else {
    document.getElementById('error').style.display = 'block';
  }
}

function showViewer() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('viewer').style.display = 'flex';
  showPage(1);
}

function showPage(n) {
  current = Math.max(1, Math.min(TOTAL, n));
  document.getElementById('pageImg').src = `pages/page_${String(current).padStart(2,'0')}.jpg`;
  document.getElementById('pageInfo').textContent = `${current} / ${TOTAL}`;
  document.querySelector('.page-area').scrollTop = 0;
}

function nextPage() { showPage(current + 1); }
function prevPage() { showPage(current - 1); }

function logout() {
  sessionStorage.removeItem('authed');
  location.reload();
}

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (sessionStorage.getItem('authed') === '1') {
    if (e.key === 'ArrowRight') nextPage();
    if (e.key === 'ArrowLeft') prevPage();
  }
});

// Disable right-click
document.addEventListener('contextmenu', e => e.preventDefault());

// Auto-login if session valid
if (sessionStorage.getItem('authed') === '1') showViewer();
</script>

</body>
</html>
