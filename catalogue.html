<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lanzuo Auto Parts - Catalogue 2026</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0A1F3D; }
.topbar { background: #0A1F3D; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
.brand { color: #fff; font-weight: 700; font-size: 16px; letter-spacing: 2px; }
.brand span { color: #EE8A35; }
.page-area { display: flex; flex-direction: column; align-items: center; padding: 20px; gap: 20px; }
.page-area img { width: 100%; max-width: 800px; box-shadow: 0 4px 30px rgba(0,0,0,0.5); }
.bottombar { background: #0A1F3D; padding: 15px 20px; display: flex; justify-content: center; align-items: center; gap: 20px; position: sticky; bottom: 0; }
.bottombar button { background: #1E3A5F; color: #fff; border: none; padding: 10px 24px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.bottombar button:hover { background: #EE8A35; }
.page-info { color: #aaa; font-size: 14px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">LANZUO <span>CATALOGUE 2026</span></div>
</div>
<div class="page-area" id="pages"></div>
<div class="bottombar">
  <span class="page-info">43 Pages</span>
</div>
<script>
const container = document.getElementById('pages');
for (let i = 1; i <= 43; i++) {
  const img = document.createElement('img');
  img.src = `pages/page_${String(i).padStart(2,'0')}.jpg`;
  img.alt = `Page ${i}`;
  container.appendChild(img);
}
</script>
</body>
</html>
